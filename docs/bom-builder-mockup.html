<!doctype html>

<title>BOM Builder — mockup v1</title>
<style>

.sm{padding:4px 10px;font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}

select.inp{width:auto}

.tw{border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:var(--p1)}

.ta{position:relative;flex:1 1 320px}.ta .inp{border-style:dashed;border-width:2px;border-color:var(--ln2);padding-left:34px;min-height:42px}.ta .pl{position:absolute;left:12px;top:8px;font-size:20px;color:var(--br);font-weight:700;pointer-events:none}
.ta .kbd{position:absolute;right:9px;top:10px;font-size:11px;color:var(--dim);border:1px solid var(--ln2);border-radius:5px;padding:0 6px;pointer-events:none}
.tl{position:absolute;z-index:30;left:0;right:0;top:calc(100% + 4px);background:var(--p1);border:1px solid var(--ln2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.5);padding:4px;max-height:300px;overflow:auto}
.ti{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:6px;cursor:pointer}.ti.hl,.ti:hover{background:#292524}.ti .why{font-size:12px;color:var(--inf);background:var(--infb);border-radius:5px;padding:0 7px}.ti .rt{margin-left:auto;font-weight:700;color:var(--br)}
.bn{border:1px solid;border-radius:8px;padding:10px 12px;display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px}.bn .t{flex:1 1 260px}.bn .t span{display:block;color:var(--mu)}
.bn.wn{background:var(--wnb);border-color:#78350f}.bn.inf{background:var(--infb);border-color:#1e3a8a}
.empty{border:1px dashed var(--ln2);border-radius:8px;padding:14px;color:var(--mu)}
.fb{display:flex;gap:8px;align-items:center;font-weight:600;font-variant-numeric:tabular-nums;font-size:13px}.fb.ok{color:var(--ok)}.fb.wn{color:var(--wn)}.fb.id{color:var(--mu);font-weight:400}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.kpi{background:var(--p2);border:1px solid var(--ln);border-radius:8px;padding:10px 12px}.kpi .l{font-size:12px;color:var(--mu)}.kpi .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .h{font-size:12px;color:var(--dim)}
.bar2{height:8px;border-radius:4px;background:var(--ln);overflow:hidden;display:flex}.bar2 i{display:block;height:100%}
textarea.inp{min-height:170px;resize:vertical;line-height:1.5}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e7e5e4;color:#1c1917;padding:10px 18px;border-radius:8px;font-weight:600;z-index:60;max-width:90vw}
.note{background:var(--p1);border:1px solid var(--ln);border-radius:8px;padding:14px 16px}.note li{margin:4px 0}
.cmp td:first-child{font-weight:600}
@media(max-width:640px){.ln{grid-template-columns:minmax(0,1fr) 30px}.ln>.row-f{grid-column:1;grid-row:2}.cost{display:none}.ln>.x{grid-column:2;grid-row:1}.sec{padding:16px}main{padding:16px}}
</style></head><body>

function pick(k,id){var pe=k==='in'?parseEntry(ta.q):null;ta={key:null,q:'',hl:0,on:false};
 if(k==='out'){choose(id);focus=D.lines.length?'#ta-in':'#batch'}
 else if(k==='sub'){var l=lineById(subFor);l.subs.push({id:'s'+(U++),it:id,q:null,follow:true,sk:[]});syncSubs();subFor=null;focus='#ta-in'}
 else{var c=pe&&pe.n!=null?conv(pe.n,pe.u,BY[id]):{q:null,n:null},nl=mk(id,c.q);nl.note=c.n;D.lines.push(nl);focus=nl.q==null?'#q-'+nl.id:'#ta-in'}render()}
function addParsed(rows){var n=0;rows.forEach(function(r){if(r.it){var nl=mk(r.it,r.q);nl.note=r.note;D.lines.push(nl);n++}else D.unk.push(r)});return n}
function act(a){var p=a.split(':');
 switch(p[0]){
 case 'newbom':D=newBom();dis={};ta={key:null,q:'',hl:0,on:false};focus='#ta-out';break;
 case 'openrow':choose(LIST[+p[1]].p);dis.copied=1;focus=null;break;
 case 'close':D=null;sku=null;subFor=null;break;
 case 'changep':D=newBom();focus='#ta-out';break;
 case 'more':D.more=!D.more;break;
 case 'blank':D.lines=[];D.ops=[];D.from=null;dis.copied=1;focus='#ta-in';break;
 case 'dismiss':dis[p[1]]=1;break;
 case 'fixq':lineById(p[1]).q=Math.round(+p[2]*1000)/1000;syncSubs();break;
 case 'del':D.lines=D.lines.filter(function(l){return l.id!==p[1]});break;
 case 'addpk':D.lines.push(mk(p[1],p[1]==='p1'?D.batch:Math.ceil(D.batch/12)));focus='#ta-in';break;
 case 'subadd':subFor=p[1];ta={key:null,q:'',hl:0,on:false};focus='#ta-sub';break;
 case 'subcancel':subFor=null;break;
 case 'subdel':var l1=lineById(p[1]);l1.subs=l1.subs.filter(function(s){return s.id!==p[2]});break;
 case 'subsame':lineById(p[1]).subs.forEach(function(s){if(s.id===p[2])s.follow=true});syncSubs();break;
 case 'subup':case 'subdn':var l3=lineById(p[1]),ix=-1;l3.subs.forEach(function(s,k){if(s.id===p[2])ix=k});var j=p[0]==='subup'?ix-1:ix+1;if(ix>=0&&j>=0&&j<l3.subs.length){var t=l3.subs[ix];l3.subs[ix]=l3.subs[j];l3.subs[j]=t}break;
 case 'skuopen':sku=sku===p[1]?null:p[1];break;
 case 'skuany':owner(p[1]).sk=[];break;
 case 'skutog':var o=owner(p[1]),i=o.sk.indexOf(p[2]);if(i>=0)o.sk.splice(i,1);else o.sk.push(p[2]);break;
 case 'oalso':if(D.outs.some(function(o){return o.it===D.p&&o.sku===p[1]})||p[1]===BY[D.p].skus[0]){toast('That product + SKU is already in this BOM');break}D.outs.push({id:'o'+(U++),it:D.p,sku:p[1],q:null});break;
 case 'orework':if(D.outs.some(function(o){return o.it==='wip1'})){toast('That product is already in this BOM');break}D.outs.push({id:'o'+(U++),it:'wip1',sku:null,q:1});break;
 case 'odel':D.outs=D.outs.filter(function(o){return o.id!==p[1]});break;
 case 'opadd':D.ops.push({id:'o'+(U++),wc:p[1],h:1});break;
 case 'opdel':D.ops=D.ops.filter(function(o){return o.id!==p[1]});break;
 case 'paste':D.paste=!D.paste;break;
 case 'dopaste':var rows=parseText($('pastebox').value),n=addParsed(rows);D.paste=false;toast('Added '+n+' lines'+(rows.length>n?'. '+(rows.length-n)+' need a look':''));focus='#ta-in';break;
 case 'newitem':toast('Opens the real new-item drawer: name, counted-in unit, and weight per unit asked once');ta={key:null,q:'',hl:0,on:false};break;
 case 'unkuse':var u=D.unk[+p[1]],ui=BY[p[2]],c=conv(u.q,u.u,ui),nl2=mk(p[2],c.q);nl2.note='From “'+u.text+'” in your file';D.lines.push(nl2);D.unk.splice(+p[1],1);break;
 case 'unknew':toast('Opens the new-item drawer pre-filled with “'+D.unk[+p[1]].text+'”');D.unk.splice(+p[1],1);break;
 case 'unkdrop':D.unk.splice(+p[1],1);break;
 case 'save':if(blocker())break;LIST.unshift({code:D.code,p:D.p,st:D.status,lines:D.lines.length,cost:costs().unit});toast('Saved '+D.code+': '+D.lines.length+' lines, '+D.ops.length+' operations, one save');D=null;break;
 case 'swapdemo':toast('Bulk tool: Sunflower oil to Rapeseed oil in 214 recipes, same amount. Preview list first, undo for 30 days');break;
 case 'impfake':toast('In this mockup every source reads as the sample recipe');imp.d=parseText(imp.t);break;
 case 'read':imp.t=$('imptext').value;imp.d=parseText(imp.t);break;
 case 'drm':var rr=imp.d[+p[1]],ai=BY.i8,cc=conv(rr.q,rr.u,ai);rr.it='i8';rr.q=cc.q;rr.u=ai.uom;break;
 case 'drn':imp.d.splice(+p[1],1);toast('Would create a new item first, then match it');break;
 case 'toeditor':choose('fp1');dis.copied=1;D.lines=[];D.ops=[];D.from=null;addParsed(imp.d);V='reg';break;
 }render()}
document.addEventListener('click',function(e){var t=e.target,v=t.closest('[data-v]');if(v){V=v.getAttribute('data-v');D=null;render();return}
 var pk=t.closest('[data-pick]');if(pk){var s=pk.getAttribute('data-pick').split(':');pick(s[0],s[1]);return}
 var a=t.closest('[data-a]');if(a){if(a.tagName==='INPUT')return;act(a.getAttribute('data-a'));return}
 if(!t.closest('.ta')&&ta.on){ta={key:null,q:'',hl:0,on:false};document.querySelectorAll('.tl').forEach(function(n){n.remove()})}});
document.addEventListener('change',function(e){var t=e.target;if(t.type==='checkbox'&&t.hasAttribute('data-a')){act(t.getAttribute('data-a'));return}if(t.hasAttribute('data-status'))D.status=t.value});
document.addEventListener('input',function(e){var t=e.target;
 if(t.hasAttribute('data-ta')){ta={key:t.getAttribute('data-ta'),q:t.value,hl:0,on:true};var w=t.parentNode,o=w.querySelector('.tl');if(o)o.remove();w.insertAdjacentHTML('beforeend',tlist(ta.key));return}
 if(t.hasAttribute('data-q')){lineById(t.getAttribute('data-q')).q=num(t.value);syncSubs();D.lines.forEach(function(x){x.subs.forEach(function(s){var f=$('sq-'+s.id);if(f&&s.follow)f.value=s.q==null?'':s.q})});derived();return}
 if(t.hasAttribute('data-sq')){var p=t.getAttribute('data-sq').split(':');lineById(p[0]).subs.forEach(function(s){if(s.id===p[1]){s.q=num(t.value);s.follow=false}});derived();return}
 if(t.hasAttribute('data-batch')){D.batch=num(t.value);derived();return}
 if(t.hasAttribute('data-oq')){D.outs.forEach(function(o){if(o.id===t.getAttribute('data-oq'))o.q=num(t.value)});derived();return}
 if(t.hasAttribute('data-yield')){D.yield=num(t.value)||98;derived();return}
 if(t.hasAttribute('data-oh')){D.ops.forEach(function(o){if(o.id===t.getAttribute('data-oh'))o.h=num(t.value)||0});derived()}});
document.addEventListener('focusin',function(e){var t=e.target;if(D&&t.hasAttribute&&t.hasAttribute('data-ta')&&!ta.on){ta={key:t.getAttribute('data-ta'),q:t.value,hl:0,on:true};if(t.value)t.parentNode.insertAdjacentHTML('beforeend',tlist(ta.key))}});
document.addEventListener('keydown',function(e){var t=e.target;
 if(t.hasAttribute&&t.hasAttribute('data-ta')){var k=t.getAttribute('data-ta'),m=matches(k);
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();ta.hl=Math.max(0,Math.min(m.length-1,ta.hl+(e.key==='ArrowDown'?1:-1)));var o=t.parentNode.querySelector('.tl');if(o)o.remove();t.parentNode.insertAdjacentHTML('beforeend',tlist(k));return}
  if(e.key==='Enter'){e.preventDefault();if(m[ta.hl])pick(k,m[ta.hl].id);return}
  if(e.key==='Escape'){if(k==='sub')subFor=null;ta={key:null,q:'',hl:0,on:false};render();return}}
 if(e.key==='Enter'&&t.hasAttribute&&(t.hasAttribute('data-q')||t.hasAttribute('data-batch'))){e.preventDefault();var f=$('ta-in');if(f)f.focus()}
 if(e.key==='Escape'&&D&&!ta.on){D=null;render()}});
document.addEventListener('paste',function(e){var t=e.target;if(D&&t.hasAttribute&&t.getAttribute('data-ta')==='in'){var tx=(e.clipboardData||window.clipboardData).getData('text');if(/\n/.test(tx.trim())){e.preventDefault();var n=addParsed(parseText(tx));ta={key:null,q:'',hl:0,on:false};toast('Added '+n+' lines');focus='#ta-in';render()}}});
render();
})();
</script></body></html>
